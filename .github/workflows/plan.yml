name: Odśwież plan z Librusa

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    # UTC; automatyczne odświeżanie co ok. 30 min, z możliwym opóźnieniem Actions
    - cron: '7,37 * * * *'

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Pobierz pliki
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Ustaw Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Zainstaluj bibliotekę
        run: python -m pip install --disable-pip-version-check --timeout 30 --retries 2 -r requirements.txt
      - name: Przygotuj Chromium wyłącznie na serwerze GitHub
        timeout-minutes: 3
        run: python -m playwright install --with-deps chromium
      - name: Testy formatu i prywatności
        run: python -m unittest -v
      - name: Pobierz i przygotuj plan
        id: sync
        continue-on-error: true
        timeout-minutes: 3
        env:
          LIBRUS_LOGIN: ${{ secrets.LIBRUS_LOGIN }}
          LIBRUS_PASSWORD: ${{ secrets.LIBRUS_PASSWORD }}
          ENABLE_BROWSER_LOGIN: 'true'
        run: python fetch.py
      - name: Skonfiguruj GitHub Pages
        uses: actions/configure-pages@v5
      - name: Wybierz wyłącznie pliki publiczne
        run: |
          mkdir public
          cp site/index.html site/status.json public/
          if [ -f site/plan.json ]; then cp site/plan.json public/; fi
          touch public/.nojekyll
      - name: Przygotuj stronę do publikacji
        uses: actions/upload-pages-artifact@v4
        with:
          path: public
    outputs:
      sync_result: ${{ steps.sync.outcome }}
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Opublikuj stronę
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Zgłoś wynik synchronizacji
        if: needs.build.outputs.sync_result != 'success'
        run: |
          echo '::error::Synchronizacja Librusa nieudana. Strona opublikowana ze stanem błędu i ostatnim poprawnym planem, jeśli istnieje.'
          exit 1
